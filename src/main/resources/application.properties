spring.application.name=demo
server.port=${SERVER_PORT:8061}

# Local secrets belong in application-local.properties (not version controlled).
# In deployment, provide the equivalent environment variables instead.
spring.config.import=optional:file:./application-local.properties

# DeepSeek / DashScope
dashscope.api-key=${DASHSCOPE_API_KEY:}
dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
dashscope.model=${DASHSCOPE_MODEL:deepseek-v3}
dashscope.embedding.api-key=${DASHSCOPE_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
dashscope.embedding.base-url=${DASHSCOPE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
dashscope.embedding-model=${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
dashscope.vision.api-key=${DASHSCOPE_VISION_API_KEY:${DASHSCOPE_API_KEY:}}
dashscope.vision.base-url=${DASHSCOPE_VISION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
dashscope.vision.model=${DASHSCOPE_VISION_MODEL:qwen-vl-max}
dashscope.image.api-key=${DASHSCOPE_IMAGE_API_KEY:${DASHSCOPE_API_KEY:}}
dashscope.image.base-url=${DASHSCOPE_IMAGE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
dashscope.image.model=${DASHSCOPE_IMAGE_MODEL:qwen-image}
dashscope.image.default-resolution=${DASHSCOPE_IMAGE_RESOLUTION:1024*1024}
dashscope.image.default-style=${DASHSCOPE_IMAGE_STYLE:写实}

# Uploads and static resources
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# Conversation memory and vector store
chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:10}
chat.memory.max-tokens=${CHAT_MEMORY_MAX_TOKENS:2000}
chat.memory.summary-threshold=${CHAT_MEMORY_SUMMARY_THRESHOLD:3000}
chat.memory.summary-keep-recent=${CHAT_MEMORY_SUMMARY_KEEP_RECENT:5}
chat.vectorstore.enabled=${VECTORSTORE_ENABLED:true}
chat.vectorstore.top-k=${VECTORSTORE_TOP_K:5}
chat.vectorstore.similarity-threshold=${VECTORSTORE_SIMILARITY_THRESHOLD:0.5}

# Databases
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ilink_chat?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.secondary.url=${RAG_DB_PATH:jdbc:sqlite:rag_knowledge.sqlite}
spring.datasource.secondary.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# External services
weather.api.base-url=${WEATHER_API_BASE_URL:https://api.seniverse.com/v3}
weather.api.api-key=${WEATHER_API_KEY:}
weather.api.connect-timeout=${WEATHER_CONNECT_TIMEOUT:5000}
weather.api.read-timeout=${WEATHER_READ_TIMEOUT:10000}
weather.api.write-timeout=${WEATHER_WRITE_TIMEOUT:10000}
amap.api-key=${AMAP_API_KEY:}
amap.base-url=${AMAP_BASE_URL:https://restapi.amap.com/v3}
amap.web-nav-base-url=${AMAP_WEB_NAV_BASE_URL:https://uri.amap.com}
xunfei.tts.app-id=${XUNFEI_TTS_APP_ID:}
xunfei.tts.api-key=${XUNFEI_TTS_API_KEY:}
xunfei.tts.api-secret=${XUNFEI_TTS_API_SECRET:}
xunfei.tts.vcn=${XUNFEI_TTS_VCN:x4_lingxiaoxuan_oral}
xunfei.tts.aue=${XUNFEI_TTS_AUE:lame}
xunfei.tts.sample-rate=${XUNFEI_TTS_SAMPLE_RATE:16000}
xunfei.tts.speed=${XUNFEI_TTS_SPEED:50}
xunfei.tts.volume=${XUNFEI_TTS_VOLUME:50}
xunfei.tts.pitch=${XUNFEI_TTS_PITCH:50}
dashscope.asr.model=${DASHSCOPE_ASR_MODEL:paraformer-realtime-v2}
dashscope.asr.sample-rate=${DASHSCOPE_ASR_SAMPLE_RATE:16000}
dashscope.asr.format=${DASHSCOPE_ASR_FORMAT:wav}
audio.converter.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
baidu.search.api-key=${BAIDU_SEARCH_API_KEY:}
baidu.search.api-url=${BAIDU_SEARCH_API_URL:https://qianfan.baidubce.com/v2/ai_search/web_search}
spring.ai.openai.base-url=${OPENAI_COMPATIBLE_BASE_URL:${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
spring.ai.openai.api-key=${OPENAI_COMPATIBLE_API_KEY:${DASHSCOPE_API_KEY:}}
spring.ai.openai.chat.options.model=${OPENAI_COMPATIBLE_MODEL:${DASHSCOPE_MODEL:deepseek-v3}}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

# Web Push and WeChat MP
webpush.vapid.public-key=${WEBPUSH_VAPID_PUBLIC_KEY:}
webpush.vapid.private-key=${WEBPUSH_VAPID_PRIVATE_KEY:}
webpush.vapid.subject=${WEBPUSH_VAPID_SUBJECT:mailto:admin@example.com}
wechat.mp.app-id=${WECHAT_MP_APP_ID:}
wechat.mp.secret=${WECHAT_MP_SECRET:}
wechat.mp.token=${WECHAT_MP_TOKEN:}
wechat.mp.aes-key=${WECHAT_MP_AES_KEY:}

# Scheduled tasks
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:4}
spring.task.scheduling.thread-name-prefix=scheduled-task-
